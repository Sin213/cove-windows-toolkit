[package]
name = "mod-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only seam: enables `DriverPackageVerifier::with_check_fn` so the
# integration suite can model the Windows trust result enum without live
# certificates. NEVER enabled in production builds; downstream crates cannot
# substitute an always-trusted check.
test-inject = []

# The sdio_signature integration suite models the Windows trust result via the
# test-only injection seam; it can only be built when the feature is on.
[[test]]
name = "sdio_signature"
required-features = ["test-inject"]

# Tab 2a-9: the source-manifest suite builds live verified tokens through the
# same test-only trust seam and drives its own test-only timing/bounds seams.
[[test]]
name = "sdio_source_manifest"
required-features = ["test-inject"]

[dependencies]
optimizer-core = { path = "../optimizer-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Clean-room LZMA (alone) decoder used by the SDIO SDW index parser. Format is
# public-domain; this crate is Apache-2.0/MIT and carries no GPL.
lzma-rs = "0.3"
# Pure-Rust 7z archive decoder for the bounded local-pack INF materialization
# slice (Tab 2a-6). Gate A6 ratified sevenz-rust2 0.22.2 (MSRV 1.93, Apache-2.0,
# actively maintained, hardened 0.21.x security line). Production enables NO
# optional features: LZMA/LZMA2/COPY codecs are always available without any
# feature, and the encoder (`compress`), AES, PPMd, bzip2, deflate, lz4, brotli,
# zstd and util stay disabled in the shipped dependency graph.
sevenz-rust2 = { version = "=0.22.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    # Tab 2a-7: SetupVerifyInfFileW (SetupAPI) for Windows-native driver-package
    # trust verification. No new crate; these features are the narrow binding
    # surface for the offline INF->catalog->trust contract the install-plan
    # gate requires.
    "Win32_Security_Cryptography",
    "Win32_Devices_DeviceAndDriverInstallation",
    # Tab 2a-7 repair: CreateFileW with a non-delete share-mode lock held
    # across the native trust call (TOCTOU hardening).
    "Win32_Storage_FileSystem",
    # Tab 2a-7 operator-repair 3: handle-relative object-bound trust path.
    # NtCreateFile with OBJECT_ATTRIBUTES.RootDirectory pins creation/opening
    # to an already-held directory object; Wdk_Storage_FileSystem binds
    # NtCreateFile and Wdk_Foundation binds OBJECT_ATTRIBUTES. No new crate.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    # Tab 2a-7 Codex-review repair 1: the integration suite must be able to
    # mount the exact attack the byte-fingerprint defends against — a writable
    # file mapping whose view outlives the handle that created it. Production
    # code never maps a file; this binds CreateFileMapping/MapViewOfFile so the
    # test can prove the defence, not so the library can use it.
    "Win32_System_Memory",
] }
# Tab 2a-7: the `windows_targets::link!` macro is the established pattern for
# declaring setupapi.dll symbols that `windows-sys 0.59` does not yet bind
# (here: `SetupVerifyInfFileW`). It is a transitive dep of `windows-sys`
# already; the direct reference here makes that use explicit and the
# Cargo.lock entry will be unchanged in version.
windows-targets = "0.52"

# Test-only: the same archive backend with the encoder enabled so integration
# tests can build deterministic synthetic .7z fixtures (Tab 2a-6 RED/GREEN).
# Production does NOT enable `compress`; `cargo check -p mod-drivers` never
# reaches encoder APIs, verified via `cargo tree -p mod-drivers -e features`.
[dev-dependencies]
sevenz-rust2 = { version = "=0.22.2", default-features = false, features = [
    "compress",
] }
