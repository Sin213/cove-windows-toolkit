name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The application binary embeds requireAdministrator, so its Windows test
      # harness cannot start in a normal non-interactive runner (error 740).
      # Clippy still compiles every target; executable unit logic belongs in libs.
      - run: cargo test --workspace --lib --locked
      - run: pnpm --dir ui audit --audit-level low
      - run: pnpm --dir ui run lint
      - run: pnpm --dir ui run build
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      # Plain `cargo audit` exits nonzero only for published vulnerabilities.
      # This step additionally blocks any maintenance warning that is not on the
      # reviewed list in scripts/audit-approved-warnings.txt.
      - run: pwsh -NoProfile -File scripts/check-cargo-audit-warnings.ps1
