name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already set in Cargo.toml, Tauri config, and ui/package.json (no leading v)'
        required: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
            [ -z "$v" ] && v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [quality, resolve-version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --prefix ui install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Verify release version is consistent
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $env:VERSION"
          }
          $workspaceVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          $tauriVersion = (Get-Content crates/optimizer-app/tauri.conf.json | ConvertFrom-Json).version
          $uiVersion = (Get-Content ui/package.json | ConvertFrom-Json).version
          if ($env:VERSION -ne $workspaceVersion -or $tauriVersion -ne $workspaceVersion -or $uiVersion -ne $workspaceVersion) {
            throw "Release version mismatch: requested=$env:VERSION workspace=$workspaceVersion tauri=$tauriVersion ui=$uiVersion"
          }

      - name: Build frontend
        run: pnpm --prefix ui build

      - name: Build Tauri app
        shell: pwsh
        working-directory: crates/optimizer-app
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $bundlePath = "target/release/bundle"

          # NSIS installer
          $nsis = Join-Path $bundlePath "nsis/Cove Windows Toolkit_$($env:VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $nsis)) {
            throw "Expected NSIS installer was not produced: $nsis"
          }
          Copy-Item -LiteralPath $nsis -Destination "release/Cove-Windows-Toolkit-$env:VERSION-Setup.exe"

          $exe = "target/release/optimizer-app.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected portable executable was not produced: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination "release/Cove-Windows-Toolkit-$env:VERSION-Portable.exe"

          Get-ChildItem release/

      - name: Upload Setup installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-setup
          path: release/Cove-Windows-Toolkit-${{ env.VERSION }}-Setup.exe
          if-no-files-found: error

      - name: Upload Portable exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: release/Cove-Windows-Toolkit-${{ env.VERSION }}-Portable.exe
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: [resolve-version, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          # Stage into a directory that does not exist in the repository. The
          # checkout above brings down tracked files under release/, and any of
          # them would otherwise be uploaded as assets of this release.
          rm -rf dist-release
          mkdir -p dist-release
          setup="artifacts/windows-setup/Cove-Windows-Toolkit-${VERSION}-Setup.exe"
          portable="artifacts/windows-portable/Cove-Windows-Toolkit-${VERSION}-Portable.exe"
          test -f "$setup"
          test -f "$portable"
          cp "$setup" "$portable" dist-release/
          cd dist-release
          for file in "Cove-Windows-Toolkit-${VERSION}-Setup.exe" "Cove-Windows-Toolkit-${VERSION}-Portable.exe"; do
            sha256sum "$file" > "$file.sha256"
          done
          # Exactly the two executables and their two sidecars must ship.
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected 4 release assets, found $count:" >&2
            ls -l >&2
            exit 1
          fi
          ls -l

      - name: Resolve release notes
        run: |
          notes="docs/release-notes/${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          echo "NOTES_PATH=$notes" >> "$GITHUB_ENV"

      - name: Attach to GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-release/*
          fail_on_unmatched_files: true
          draft: true
          name: Cove Windows Toolkit v${{ env.VERSION }}
          body_path: ${{ env.NOTES_PATH }}
