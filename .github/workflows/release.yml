name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (no leading v)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
            [ -z "$v" ] && v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/optimizer-app

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --prefix ui install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Verify release version is consistent
        shell: pwsh
        run: |
          $workspaceVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          $tauriVersion = (Get-Content crates/optimizer-app/tauri.conf.json | ConvertFrom-Json).version
          $uiVersion = (Get-Content ui/package.json | ConvertFrom-Json).version
          if ($env:VERSION -ne $workspaceVersion -or $tauriVersion -ne $workspaceVersion -or $uiVersion -ne $workspaceVersion) {
            throw "Release version mismatch: requested=$env:VERSION workspace=$workspaceVersion tauri=$tauriVersion ui=$uiVersion"
          }

      - name: Build frontend
        run: pnpm --prefix ui build

      - name: Build Tauri app
        shell: pwsh
        working-directory: crates/optimizer-app
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":""}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $bundlePath = "target/release/bundle"

          # NSIS installer
          $nsis = Join-Path $bundlePath "nsis/Cove Windows Toolkit_$($env:VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $nsis)) {
            throw "Expected NSIS installer was not produced: $nsis"
          }
          Copy-Item -LiteralPath $nsis -Destination "release/Cove-Windows-Toolkit-$env:VERSION-Setup.exe"

          $exe = "target/release/optimizer-app.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected portable executable was not produced: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination "release/Cove-Windows-Toolkit-$env:VERSION-Portable.exe"

          Get-ChildItem release/

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/Cove-Windows-Toolkit-${{ env.VERSION }}-Setup.exe
          if-no-files-found: error

      - name: Upload Portable exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/Cove-Windows-Toolkit-${{ env.VERSION }}-Portable.exe
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: [resolve-version, build-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          setup="artifacts/windows-setup/Cove-Windows-Toolkit-${VERSION}-Setup.exe"
          portable="artifacts/windows-portable/Cove-Windows-Toolkit-${VERSION}-Portable.exe"
          test -f "$setup"
          test -f "$portable"
          cp "$setup" "$portable" release/
          cd release
          for file in "Cove-Windows-Toolkit-${VERSION}-Setup.exe" "Cove-Windows-Toolkit-${VERSION}-Portable.exe"; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          body: |
            ## Cove Windows Toolkit v${{ env.VERSION }}

            ### Downloads

            | File | Type |
            |------|------|
            | `Cove-Windows-Toolkit-${{ env.VERSION }}-Setup.exe` | Windows Installer |
            | `Cove-Windows-Toolkit-${{ env.VERSION }}-Portable.exe` | Portable (no install) |

          make_latest: true
